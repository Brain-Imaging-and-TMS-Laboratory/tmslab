- name: Hangbin Zhang, M.S.
  role: Graduate Student
  photo: zhang_hangbin.jpg
  alt: Hangbin Zhang
  bio: >-
    Hangbin is a Ph.D. student in the Cognition and Neural Systems track studying the entorhinal–hippocampal circuit, an early locus of Alzheimer's pathology. His work combines subregion-resolution diffusion MRI, ASL, BOLD fMRI, and EEG with connectivity-guided repetitive TMS to characterize this circuit and to test whether it remains modifiable at the prodromal stage. His current work tests whether hippocampal perfusion remains modifiable in mild cognitive impairment following network-guided theta-burst stimulation. In parallel, he develops embedding-based language markers as a scalable, low-cost index of entorhinal–hippocampal function, alongside work on reproducible neuroimaging pipelines. He holds an M.S. in Experimental Psychology with Data Science from the University of Manchester and a B.S. in Psychology from Southwest University.

- name: Sarah Norman, M.A.
  role: Graduate Student
  photo: norman.jpg
  alt: Sarah Norman
  bio: >-
    Sarah Norman is a Ph.D. student in the Cognitive Neuroscience and Systems (CNS) program at the University of Arizona. Her research focuses on understanding age-related changes in cognition and brain function, with a particular interest in developing and optimizing noninvasive brain stimulation interventions to support cognitive health in older adults. She is especially interested in how individualized approaches to transcranial magnetic stimulation (TMS), informed by neuroimaging and electric field modeling, can improve cognitive outcomes across the aging spectrum, from healthy aging to mild cognitive impairment. Sarah's work integrates neuropsychological assessment, structural and functional MRI, diffusion tensor imaging (DTI), TMS, and computational modeling techniques such as SimNIBS to investigate the neural mechanisms underlying cognitive aging and intervention response. Outside of the lab, Sarah enjoys sewing, swimming and enjoying the Tucson food scene. M.A. in Psychology, University of Arizona. B.S. in Psychology, Washington State University.

- name: Reyna Hickey, M.A.
  role: Graduate Student
  photo: hickey.jpg
  alt: Reyna Hickey
  bio: >-
    Reyna is a Ph.D. student in the Clinical Neuropsychology track working on early detection and intervention for cognitive impairment. Her goal is to identify treatments, and support for adults experience cognitive decline that allows for improvements to their daily lives, and preserves function. She combines neuropsychological assessments with neuroimaging (DTI, MRI, ASL etc.) and interventions (TMS, cognitive training, exercise) to study the potential of early intervention, before significant cognitive changes. Outside of research, Reyna is interested in neuropsychological assessment and supporting the community through Friends of Aphasia and other outreach work. Currently, Reyna holds a M.A. in Psychology from the University of Arizona, and a B.S. in Neuroscience from the University of Illinois.

