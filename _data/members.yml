- name: Cody Moxam, M.S.
  role: Graduate Student
  photo: cody.jpg
  alt: Cody Moxam
  bio: >-
    Cody Moxam received his M.S. in Biomedical Engineering with a focus in
    Neuroengineering from Johns Hopkins University, where he also concentrated
    in Electrical Engineering and Computer Science with an emphasis on
    Artificial Intelligence. His current research focuses on translating
    advanced signal processing and analytical methods into novel biomarkers and
    therapeutic strategies for cognitive aging, mild cognitive impairment, and
    Alzheimer's disease. He is also building toward a future research program in
    AI-driven closed-loop neuromodulation. Cody pursues these goals simply to
    improve the standard of care for patients around the world in hopes of
    improving the lives of them and their loved ones. He is currently pursuing
    an MD/PhD at the University of Arizona.

