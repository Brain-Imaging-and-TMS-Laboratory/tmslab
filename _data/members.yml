- name: Hangbin Zhang, M.S.
  role: Graduate Student
  photo: zhang_hangbin.jpg
  alt: Hangbin Zhang
  bio: >-
    Hangbin is a Ph.D. student in the CNS track working on the
    aging–MCI–Alzheimer's continuum. His goal is to push intervention earlier,
    before the irreversible window closes. He combines repetitive TMS,
    functional MRI (ASL and BOLD), and diffusion MRI of hippocampal subfields to
    track plasticity and microstructural changes associated with cognitive
    aging. He's interested in pretty much anything that moves the needle on
    early detection, from optimizing ASL pipelines to developing more precise
    cognitive measurement tools. He also works on reproducible neuroimaging
    pipelines and on LLM-based neurolinguistic markers of cognitive aging, using
    language models as a bridge between cognition and brain function. Outside of
    research, he's been Instructor of Record for Methods in Cognitive Science
    (COGS 321) and Drugs, Brain, and Behavior (PSY 413). M.S. in Experimental
    Psychology with Data Science, University of Manchester. B.S. in Psychology,
    Southwest University.

- name: Sarah Norman, M.A.
  role: Graduate Student
  photo: norman.jpg
  alt: Sarah Norman
  bio: >-
    Sarah Norman is a Ph.D. student in the Cognitive Neuroscience and Systems
    (CNS) program at the University of Arizona. Her research focuses on
    understanding age-related changes in cognition and brain function, with a
    particular interest in developing and optimizing noninvasive brain
    stimulation interventions to support cognitive health in older adults. She
    is especially interested in how individualized approaches to transcranial
    magnetic stimulation (TMS), informed by neuroimaging and electric field
    modeling, can improve cognitive outcomes across the aging spectrum, from
    healthy aging to mild cognitive impairment. Sarah's work integrates
    neuropsychological assessment, structural and functional MRI, diffusion
    tensor imaging (DTI), TMS, and computational modeling techniques such as
    SimNIBS to investigate the neural mechanisms underlying cognitive aging and
    intervention response. Outside of the lab, Sarah enjoys sewing, swimming and
    enjoying the Tucson food scene. M.A. in Psychology, University of Arizona.
    B.S. in Psychology, Washington State University.

